<!DOCTYPE html>
<html>
<head><title>Generate PWA Icons</title></head>
<body>
<p>Right-click each canvas and "Save Image As" to the public/ folder.</p>
<script>
const sizes = [192, 512, 180];
const names = ['pwa-192x192', 'pwa-512x512', 'apple-touch-icon'];

sizes.forEach((size, i) => {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background circle
  ctx.fillStyle = '#6366f1';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.22);
  ctx.fill();

  // Baby icon (simplified)
  const s = size * 0.45;
  const cx = size / 2;
  const cy = size / 2;

  // Head
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx, cy - s * 0.15, s * 0.32, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.beginPath();
  ctx.ellipse(cx, cy + s * 0.3, s * 0.25, s * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#6366f1';
  ctx.beginPath();
  ctx.arc(cx - s * 0.1, cy - s * 0.2, s * 0.04, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + s * 0.1, cy - s * 0.2, s * 0.04, 0, Math.PI * 2);
  ctx.fill();

  // Smile
  ctx.strokeStyle = '#6366f1';
  ctx.lineWidth = s * 0.03;
  ctx.beginPath();
  ctx.arc(cx, cy - s * 0.1, s * 0.08, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.stroke();

  const label = document.createElement('p');
  label.textContent = `${names[i]}.png (${size}x${size})`;
  document.body.appendChild(label);
  document.body.appendChild(canvas);
});
</script>
</body>
</html>
