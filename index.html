<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baby Tracker</title>
    <meta name="description" content="Track your baby's feedings, diapers, and medications" />
    <!-- Matches --color-bg in each scheme: an indigo bar over a near-black app
         reads as a rendering glitch once the PWA is installed. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0e1a" />
    <!-- Apple PWA support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baby Tracker" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
